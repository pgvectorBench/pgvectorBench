name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.build_type }}, ${{ matrix.arrow_mode }} Arrow)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PGVECTORBENCH_TEST_DATABASE: postgres
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_DIR: ${{ github.workspace }}/.sccache

    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            arrow_mode: vendored
            use_system_arrow: false
          - build_type: Release
            arrow_mode: vendored
            use_system_arrow: false
          - build_type: Release
            arrow_mode: system
            use_system_arrow: true

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore sccache cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: >-
            sccache-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.arrow_mode }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.arrow_mode }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates cmake g++ git libpq-dev lsb-release ninja-build postgresql postgresql-server-dev-all wget

      - name: Install system Arrow and Parquet
        if: matrix.use_system_arrow
        shell: bash
        run: |
          set -euxo pipefail
          distro="$(lsb_release --id --short | tr 'A-Z' 'a-z')"
          codename="$(lsb_release --codename --short)"
          arrow_package="apache-arrow-apt-source-latest-${codename}.deb"
          wget --quiet "https://packages.apache.org/artifactory/arrow/${distro}/${arrow_package}"
          sudo apt-get install -y -V "./${arrow_package}"
          sudo apt-get update
          sudo apt-get install -y -V libparquet-dev

      - name: Start test database
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createuser --superuser runner

      - name: Install pgvector for integration tests
        run: bash tests/install_pgvector.sh

      - name: Configure
        run: >-
          cmake --preset default
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPGVECTORBENCH_USE_SYSTEM_ARROW=${{ matrix.use_system_arrow }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build --preset default --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Smoke-test CLI
        run: |
          ./build/pgvectorbench --version
          ./build/pgvectorbench --help

      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats

      - name: Save sccache cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: >-
            sccache-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.arrow_mode }}-${{ github.run_id }}

  macos:
    name: Build (macOS 15)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PGVECTORBENCH_TEST_DATABASE: postgres
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_DIR: ${{ github.workspace }}/.sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore sccache cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-Release-vendored-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-Release-vendored-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Install build dependencies
        run: |
          brew install cmake git ninja postgresql@17
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"

      - name: Start test database
        run: |
          brew services start postgresql@17
          for attempt in {1..30}; do
            if pg_isready --quiet; then
              exit 0
            fi
            sleep 1
          done
          brew services info postgresql@17
          exit 1

      - name: Install pgvector for integration tests
        run: bash tests/install_pgvector.sh

      - name: Configure
        run: >-
          cmake --preset default
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$(brew --prefix postgresql@17)"
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build --preset default --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Smoke-test CLI
        run: |
          ./build/pgvectorbench --version
          ./build/pgvectorbench --help

      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats

      - name: Save sccache cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-Release-vendored-${{ github.run_id }}
